theme = "tokyonight"
# theme = "sonokai_transparent";
# theme = "tokyonight_transparent";
# theme = "sonokai";
# theme = "snazzy_transparent";
# theme = "gruvbox_transparent";
# theme = "catppuccin_mocha_transparent";
# theme = "doom_acario_dark" # does not look good for content inside markdown code block;

[editor]
bufferline = "multiple"
color-modes = true
completion-trigger-len = 1
cursorline = true
default-line-ending = "lf"
end-of-line-diagnostics = "hint"
idle-timeout = 10
insert-final-newline = false
line-number = "relative"
mouse = false
rulers = [80]
scroll-lines = 1
shell = ["nu", "--stdin", "-c"]
text-width = 120
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-color-swatches = true

[editor.soft-wrap]
enable = true
max-wrap = 10
wrap-at-text-width = true

[editor.statusline]
left = [
  "mode",
  "spacer",
  "version-control",
  "spacer",
  "separator",
  "file-name",
  "file-modification-indicator",
]
right = [
  "spinner",
  "spacer",
  "workspace-diagnostics",
  "separator",
  "spacer",
  "diagnostics",
  "selections",
  "position",
  "file-encoding",
  "file-line-ending",
  "file-type",
]
separator = "╎"

[editor.whitespace.characters]
nbsp = "⍽"
newline = "⏎"
space = "·"
tab = "→"
tabpad = "·"

[editor.whitespace.indent-guides]
character = "╎"
render = true
skip-levels = 1

[editor.whitespace.render]
nbsp = "all"
newline = "none"
nnbsp = "all"
space = "none"
tab = "all"

[keys.insert]
C-space = "completion"
C-z = "no_op"
down = "no_op"
end = "no_op"
home = "no_op"
left = "no_op"
pagedown = "no_op"
pageup = "no_op"
right = "no_op"
up = "no_op"

[keys.normal]
";" = "keep_primary_selection"
A-x = "extend_line_above"
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"
C-n = ["move_line_down", "scroll_down"]
C-p = ["move_line_up", "scroll_up"]
C-r = "insert_register"
C-z = "no_op"
D = "delete_char_backward"
K = "insert_newline"
X = "extend_line_up"
esc = ["collapse_selection"]
ret = ["move_line_down", "goto_first_nonwhitespace"]

[keys.normal.space]
F = "file_picker"
c = ":buffer-close"
f = "file_picker_in_current_directory"
l = [":lsp-stop", ":lsp-restart"]
w = ":write-all"

[keys.select]
";" = ["keep_primary_selection", "exit_select_mode"]
