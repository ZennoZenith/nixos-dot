[main]
include=~/.config/foot_themes/ghostty-mathias
font=CaskaydiaCove Nerd Font Mono:size=10
font=CaskaydiaMono Nerd Font:size=10
shell=/usr/bin/env nu

[tweak]
font-monospace-warn=no

[cursor]
style=block

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.3

[key-bindings]
fullscreen=Alt+Shift+Return

